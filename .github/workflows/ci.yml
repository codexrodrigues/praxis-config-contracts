name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify lightweight runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress dependency:tree -Dscope=runtime -DoutputFile=target/runtime-dependencies.txt
          if grep -E 'org\.springframework|org\.springframework\.boot|jakarta\.persistence' target/runtime-dependencies.txt; then
            echo 'Forbidden runtime dependency detected.' >&2
            exit 1
          fi
